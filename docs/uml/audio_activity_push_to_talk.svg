<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1044" viewBox="0 0 880 1044" font-family="Segoe UI, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
  <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1f2933" stroke-width="1.4"/>
  </marker>
  <marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 Z" fill="#1f2933"/>
  </marker>
  <marker id="diamond" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" orient="auto-start-reverse">
    <path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#1f2933"/>
  </marker>
  <marker id="hollow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
    <path d="M1,1 L15,8 L1,15 Z" fill="#fff" stroke="#1f2933" stroke-width="1.4"/>
  </marker>
</defs>
<text x="20.0" y="34.0" font-size="22" text-anchor="start" fill="#1f2933" font-weight="bold" xml:space="preserve">Push-to-talk: UML activity diagram</text>
<text x="20.0" y="56.0" font-size="12.5" text-anchor="start" fill="#52606d" xml:space="preserve">The whole phone screen is one button; the answer always comes back out loud.</text>
<rect x="20.0" y="80.0" width="420.0" height="934.0" rx="0" fill="none" stroke="#1f2933" stroke-width="1.2"/>
<rect x="20.0" y="80.0" width="420.0" height="30.0" rx="0" fill="#dde7f5" stroke="#1f2933" stroke-width="1.2"/>
<text x="230.0" y="100.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold" xml:space="preserve">Phone app</text>
<rect x="440.0" y="80.0" width="420.0" height="934.0" rx="0" fill="none" stroke="#1f2933" stroke-width="1.2"/>
<rect x="440.0" y="80.0" width="420.0" height="30.0" rx="0" fill="#fbe3cc" stroke="#1f2933" stroke-width="1.2"/>
<text x="650.0" y="100.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold" xml:space="preserve">Python assistant</text>
<circle cx="230.0" cy="150" r="11" fill="#1f2933"/>
<rect x="80.0" y="201.0" width="300.0" height="46.0" rx="18" fill="#fff" stroke="#1f2933" stroke-width="1.4"/>
<text x="230.0" y="229.0" font-size="13" text-anchor="middle" fill="#1f2933" xml:space="preserve">Wait: the whole screen is the button</text>
<rect x="80.0" y="275.0" width="300.0" height="46.0" rx="18" fill="#fff" stroke="#1f2933" stroke-width="1.4"/>
<text x="230.0" y="303.0" font-size="13" text-anchor="middle" fill="#1f2933" xml:space="preserve">Pressed: vibrate, stop any speech</text>
<rect x="80.0" y="349.0" width="300.0" height="46.0" rx="18" fill="#fff" stroke="#1f2933" stroke-width="1.4"/>
<text x="230.0" y="377.0" font-size="13" text-anchor="middle" fill="#1f2933" xml:space="preserve">Listen while the screen is held</text>
<rect x="80.0" y="423.0" width="300.0" height="46.0" rx="18" fill="#fff" stroke="#1f2933" stroke-width="1.4"/>
<text x="230.0" y="451.0" font-size="13" text-anchor="middle" fill="#1f2933" xml:space="preserve">Released: vibrate, speech-to-text</text>
<polygon points="230.0,484 287.6,520 230.0,556 172.4,520" fill="#fff" stroke="#1f2933" stroke-width="1.4"/><text x="230.0" y="524.0" font-size="11.5" text-anchor="middle" fill="#1f2933" xml:space="preserve">known command?</text>
<rect x="80.0" y="571.0" width="300.0" height="46.0" rx="18" fill="#fff" stroke="#b44d12" stroke-width="1.4"/>
<text x="230.0" y="599.0" font-size="13" text-anchor="middle" fill="#1f2933" xml:space="preserve">Send voice_command over the bridge</text>
<rect x="500.0" y="645.0" width="300.0" height="46.0" rx="18" fill="#fff" stroke="#1f2933" stroke-width="1.4"/>
<text x="650.0" y="673.0" font-size="13" text-anchor="middle" fill="#1f2933" xml:space="preserve">VoiceControl.handle(command)</text>
<polygon points="650.0,706 707.6,742 650.0,778 592.4,742" fill="#fff" stroke="#1f2933" stroke-width="1.4"/><text x="650.0" y="746.0" font-size="11.5" text-anchor="middle" fill="#1f2933" xml:space="preserve">STOP_SESSION?</text>
<rect x="500.0" y="793.0" width="300.0" height="46.0" rx="18" fill="#fff" stroke="#1f2933" stroke-width="1.4"/>
<text x="650.0" y="821.0" font-size="13" text-anchor="middle" fill="#1f2933" xml:space="preserve">Answer out loud: say(…, URGENT)</text>
<rect x="80.0" y="867.0" width="300.0" height="46.0" rx="18" fill="#fff" stroke="#b44d12" stroke-width="1.4"/>
<text x="230.0" y="895.0" font-size="13" text-anchor="middle" fill="#1f2933" xml:space="preserve">Speak the answer (say message)</text>
<rect x="500.0" y="911.0" width="300.0" height="46.0" rx="18" fill="#fff" stroke="#1f2933" stroke-width="1.4"/>
<text x="650.0" y="939.0" font-size="13" text-anchor="middle" fill="#1f2933" xml:space="preserve">Say “Session ended”, end session</text>
<circle cx="650.0" cy="982" r="12" fill="#fff" stroke="#1f2933" stroke-width="1.6"/><circle cx="650.0" cy="982" r="7" fill="#1f2933"/>
<polyline points="230.0,161.0 230.0,201.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<polyline points="230.0,247.0 230.0,275.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<text x="238.0" y="268.0" font-size="11.5" text-anchor="start" fill="#52606d" font-style="italic" xml:space="preserve">screen pressed</text>
<polyline points="230.0,321.0 230.0,349.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<polyline points="230.0,395.0 230.0,423.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<text x="238.0" y="416.0" font-size="11.5" text-anchor="start" fill="#52606d" font-style="italic" xml:space="preserve">screen released</text>
<polyline points="230.0,469.0 230.0,484.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<polyline points="230.0,556.0 230.0,571.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<text x="238.0" y="572.0" font-size="11.5" text-anchor="start" fill="#52606d" font-style="italic" xml:space="preserve">yes</text>
<polyline points="172.0,520.0 38.0,520.0 38.0,224.0 80.0,224.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<text x="44.0" y="512.0" font-size="11.5" text-anchor="start" fill="#52606d" font-style="italic" xml:space="preserve">no: drop it</text>
<polyline points="380.0,594.0 650.0,594.0 650.0,645.0" fill="none" stroke="#b44d12" stroke-width="1.4" marker-end="url(#open)"/>
<polyline points="650.0,691.0 650.0,706.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<polyline points="650.0,778.0 650.0,793.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<text x="658.0" y="794.0" font-size="11.5" text-anchor="start" fill="#52606d" font-style="italic" xml:space="preserve">no</text>
<polyline points="708.0,742.0 842.0,742.0 842.0,934.0 800.0,934.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<text x="836.0" y="734.0" font-size="11.5" text-anchor="end" fill="#52606d" font-style="italic" xml:space="preserve">yes</text>
<polyline points="650.0,957.0 650.0,970.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<polyline points="650.0,839.0 650.0,890.0 380.0,890.0" fill="none" stroke="#b44d12" stroke-width="1.4" marker-end="url(#open)"/>
<polyline points="230.0,867.0 230.0,861.0 426.0,861.0 426.0,194.0 270.0,194.0 270.0,201.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#open)"/>
<text x="418.0" y="853.0" font-size="11.5" text-anchor="end" fill="#52606d" font-style="italic" xml:space="preserve">back to waiting</text>
<text x="20.0" y="1030.0" font-size="11.5" text-anchor="start" fill="#b44d12" xml:space="preserve">Orange: the bridge messages, not built yet; until then --voice-script and the laptop speaker stand in.</text>
</svg>
