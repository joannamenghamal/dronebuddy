<svg xmlns="http://www.w3.org/2000/svg" width="1305" height="870" viewBox="0 0 1305 870" font-family="Segoe UI, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
  <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1f2933" stroke-width="1.4"/>
  </marker>
  <marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11 Z" fill="#1f2933"/>
  </marker>
  <marker id="diamond" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" orient="auto-start-reverse">
    <path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#1f2933"/>
  </marker>
  <marker id="hollow" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
    <path d="M1,1 L15,8 L1,15 Z" fill="#fff" stroke="#1f2933" stroke-width="1.4"/>
  </marker>
</defs>
<text x="20.0" y="34.0" font-size="22" text-anchor="start" fill="#1f2933" font-weight="bold" xml:space="preserve">“Where is my cup?”: UML sequence diagram</text>
<text x="20.0" y="56.0" font-size="12.5" text-anchor="start" fill="#52606d" xml:space="preserve">From holding the phone&#x27;s screen to the answer in the user&#x27;s ear. Orange: the two bridge messages.</text>
<rect x="28.0" y="90.0" width="164.0" height="36.0" rx="6" fill="#eef0f3" stroke="#1f2933" stroke-width="1.4"/>
<text x="110.0" y="112.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold" xml:space="preserve">User</text>
<polyline points="110.0,136.0 110.0,780.0" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="233.0" y="90.0" width="164.0" height="46.0" rx="6" fill="#dde7f5" stroke="#1f2933" stroke-width="1.4"/>
<text x="315.0" y="112.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold" xml:space="preserve">Phone app</text>
<text x="315.0" y="128.0" font-size="11" text-anchor="middle" fill="#52606d" xml:space="preserve">push-to-talk + speech-to-text</text>
<polyline points="315.0,136.0 315.0,780.0" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="438.0" y="90.0" width="164.0" height="46.0" rx="6" fill="#eef0f3" stroke="#1f2933" stroke-width="1.4"/>
<text x="520.0" y="112.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold" xml:space="preserve">main loop</text>
<text x="520.0" y="128.0" font-size="11" text-anchor="middle" fill="#52606d" xml:space="preserve">+ MicInput</text>
<polyline points="520.0,136.0 520.0,780.0" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="643.0" y="90.0" width="164.0" height="36.0" rx="6" fill="#dde7f5" stroke="#1f2933" stroke-width="1.4"/>
<text x="725.0" y="112.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold" xml:space="preserve">VoiceControl</text>
<polyline points="725.0,136.0 725.0,780.0" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="848.0" y="90.0" width="164.0" height="36.0" rx="6" fill="#fbe3cc" stroke="#1f2933" stroke-width="1.4"/>
<text x="930.0" y="112.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold" xml:space="preserve">ObjectLocator</text>
<polyline points="930.0,136.0 930.0,780.0" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="1053.0" y="90.0" width="164.0" height="46.0" rx="6" fill="#fbe3cc" stroke="#1f2933" stroke-width="1.4"/>
<text x="1135.0" y="112.0" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="bold" xml:space="preserve">AudioOutput</text>
<text x="1135.0" y="128.0" font-size="11" text-anchor="middle" fill="#52606d" xml:space="preserve">+ BridgeSpeech</text>
<polyline points="1135.0,136.0 1135.0,780.0" fill="none" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="7,5"/>
<rect x="480.0" y="144.0" width="710.0" height="54.0" rx="0" fill="none" stroke="#1f2933" stroke-width="1.1"/>
<rect x="480.0" y="144.0" width="52.0" height="18.0" rx="0" fill="#eef0f3" stroke="#1f2933" stroke-width="1.1"/>
<text x="486.0" y="157.0" font-size="11.5" text-anchor="start" fill="#1f2933" font-weight="bold" xml:space="preserve">loop</text>
<polyline points="520.0,170.0 926.0,170.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#filled)"/>
<text x="725.0" y="162.0" font-size="12.5" text-anchor="middle" fill="#1f2933" xml:space="preserve">locate(detections, user, w, h)</text>
<text x="942.0" y="188.0" font-size="11.5" text-anchor="start" fill="#52606d" font-style="italic" xml:space="preserve">every frame: remembers where each object was last seen</text>
<polyline points="110.0,228.0 311.0,228.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#filled)"/>
<text x="212.5" y="220.0" font-size="12.5" text-anchor="middle" fill="#1f2933" xml:space="preserve">holds the screen: “where is my mug?”</text>
<polyline points="315.0,278.0 359.0,278.0 359.0,298.0 317.0,298.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#filled)"/>
<text x="367.0" y="292.0" font-size="12.5" text-anchor="start" fill="#1f2933" xml:space="preserve">vibrate, stop speech, recognize; “mug” → cup</text>
<polyline points="315.0,344.0 516.0,344.0" fill="none" stroke="#b44d12" stroke-width="1.4" marker-end="url(#filled)"/>
<text x="417.5" y="336.0" font-size="12.5" text-anchor="middle" fill="#b44d12" font-weight="bold" xml:space="preserve">voice_command {WHERE_IS, cup}</text>
<polyline points="520.0,402.0 721.0,402.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#filled)"/>
<text x="622.5" y="394.0" font-size="12.5" text-anchor="middle" fill="#1f2933" xml:space="preserve">handle(command)</text>
<polyline points="725.0,460.0 926.0,460.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#filled)"/>
<text x="827.5" y="452.0" font-size="12.5" text-anchor="middle" fill="#1f2933" xml:space="preserve">find(&quot;cup&quot;)</text>
<polyline points="930.0,518.0 729.0,518.0" fill="none" stroke="#1f2933" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#open)"/>
<text x="827.5" y="510.0" font-size="12.5" text-anchor="middle" fill="#1f2933" xml:space="preserve">“Cup on your left”, pan -0.7</text>
<polyline points="725.0,576.0 1131.0,576.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#filled)"/>
<text x="930.0" y="568.0" font-size="12.5" text-anchor="middle" fill="#1f2933" xml:space="preserve">say(answer, URGENT, pan -0.7)</text>
<polyline points="1135.0,634.0 319.0,634.0" fill="none" stroke="#b44d12" stroke-width="1.4" marker-end="url(#filled)"/>
<text x="725.0" y="626.0" font-size="12.5" text-anchor="middle" fill="#b44d12" font-weight="bold" xml:space="preserve">say {“Cup on your left”, URGENT, pan -0.7}</text>
<polyline points="315.0,692.0 114.0,692.0" fill="none" stroke="#1f2933" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#open)"/>
<text x="212.5" y="684.0" font-size="12.5" text-anchor="middle" fill="#1f2933" xml:space="preserve">speaks it, in the left ear</text>
<rect x="20.0" y="800.0" width="1265.0" height="50.0" rx="6" fill="#fff7ed" stroke="#b44d12" stroke-width="1.4" stroke-dasharray="6,4"/>
<text x="36.0" y="821.0" font-size="12.5" text-anchor="start" fill="#1f2933" xml:space="preserve">Python&#x27;s side of both bridge messages is built. Until the phone app handles them, test with --drone mock:</text>
<text x="36.0" y="839.0" font-size="12.5" text-anchor="start" fill="#1f2933" xml:space="preserve">--voice-script stands in for the phone&#x27;s voice_command, and the laptop speaks the answer.</text>
</svg>
